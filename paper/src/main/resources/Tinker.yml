Settings:
  Tinker-Version: 1.1
  GUIName: '&7&lThe &4&lCrazy &c&lTinkerer' #Name of the Tinker GUI
  Currency: XP_Total #The currency you wish to use.
  TradeButton: '&eClick to accept the trade' #The Red Buttons in the Tinkerer
  TradeButton-Type: "RED_STAINED_GLASS_PANE"
  TradeButton-Lore: #Lore on the trade buttons.
    - ''
  # Item model settings
  TradeButton-Model:
    # minecraft, or nexo, or oraxen
    Namespace: ""
    # diamond_helmet
    Key: ""
  BottleOptions:
    Item: 'EXPERIENCE_BOTTLE' #Item the XP bottles are
    # Item model settings
    Model:
      # minecraft, or nexo, or oraxen
      Namespace: ""
      # diamond_helmet
      Key: ""
    Name: '&aRecycled XP' #Name of the Bottle
    Lore: #Lore of the Bottle
      - '&a&lRecycled &6%total%XP'
      - '&7&l(&6&l!&7&l) &7Throw to get XP.'
  # Highest percent a Mystery Dust rolled from a recycled book may reach,
  # keyed by the enchantment's resolved rarity. A book counts for a tier only
  # when it resolves to exactly that one rarity. Missing tiers use the old
  # formula from Tinker.Crazy-Enchantments.<name>.Book. Invalid caps fall back
  # to 1%; valid caps are 1–100 and independent of natural Mystery Dust rolls.
  Tier-Potency-Cap:
    Simple: 5
    Unique: 10
    Elite: 15
    Ultimate: 20
    Legendary: 25
Tinker:
  Vanilla-Enchantments:
    #Armor Enchantments
    PROTECTION_ENVIRONMENTAL: '24, 1' #<Base amount of Xp(Lvl/Total)/Money>, <Amount per level>.
