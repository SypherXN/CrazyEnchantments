# Enchantment Types:
# - Armor ~ All armor
# - Helmet
# - Boots
# - Bow
# - Axe
# - Sword
# - PickAxe
# - Hoe
# - Tool ~ Pickaxes, Axes, Shovels, Hoes, and Shears
# - All ~ All items listed here
##########
# Chance System
#
# Chance-System:
#   Base: # Starting chance.
#   Increase: # The amount it goes up each level.
##########
# Rarity (optional)
#
#   A block whose Categories holds exactly one value may pin its tier with
#   Rarity. Multi-category books omit it and keep their existing pools.
#   Allowed: Simple, Unique, Elite, Ultimate, Legendary.
#
# Rarity-Format (root key, not under Enchantments)
#
#   1 - legacy names: Common, Rare, Legendary, Ultimate, Mythical. The legacy
#       Legendary is the third tier and resolves to Elite. Absent means 1.
#   2 - Cosmic names, taken literally: Legendary is the top tier.
#
#   The same format governs this file's Categories entries and config.yml's
#   Categories sections, so rename both before setting 2. A name the chosen
#   format does not know is warned about and ignored; nothing is remapped in
#   silence.
#
# Tuning (optional)
#
#   Per-enchant effect numbers, the same names and values the fork used to
#   keep in config.yml's CosmicEnchants section.
##########
Rarity-Format: 2
