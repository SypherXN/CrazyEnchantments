      # FORK Maximum stacks a victim can carry.
      Stack-Cap: 5
      # FORK Seconds a stack refresh lasts.
      Duration-Seconds: 5.0
      # FORK Movement-speed percentage points removed per stack.
      Slow-Per-Stack-PP: 5.0
      # FORK Maximum movement-speed percentage points Bleed may remove.
      Slow-Cap-PP: 60.0
    Sound: "ENTITY_PLAYER_LEVELUP"
    Name: '&7Bleed'
    MaxPower: 6
