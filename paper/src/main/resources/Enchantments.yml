  Bleed:
    Enabled: true
    Rarity: 'Ultimate'
    Tuning:
      # FORK Seconds between Bleed damage ticks. 1.0 = one tick per second.
      Cadence-Seconds: 1.0
      # FORK HP per stack each tick. Damage goes through normal damage, so armor applies.
